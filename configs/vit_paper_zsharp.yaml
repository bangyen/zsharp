# Paper configuration (arXiv:2505.02369) with ViT-7/8/8-384: 7 layers,
# 8 heads, 8 patches per side, MLP dimension 384.
dataset: cifar10
model: vit_7_8_8_384
optimizer:
  type: zsharp
  rho: 0.05
  percentile: 95
  lr: 0.001
  momentum: 0.9  # unused by zsharp; AdamW is the base optimizer
  weight_decay: 5e-5
train:
  batch_size: 256
  epochs: 200
  device: auto
  num_workers: 4
  pin_memory: false
  use_mixed_precision: false
  checkpoint_dir: checkpoints  # resume after interruption
