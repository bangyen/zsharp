# Quick smoke test: paper hyperparameters, but only 2 epochs.
dataset: cifar10
model: resnet18
optimizer:
  type: zsharp
  rho: 0.05
  percentile: 95
  lr: 0.001
  momentum: 0.9  # unused by zsharp; AdamW is the base optimizer
  weight_decay: 5e-5
train:
  batch_size: 128
  epochs: 2
  device: auto
  num_workers: 2
  pin_memory: false
  use_mixed_precision: false
