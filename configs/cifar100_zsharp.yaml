# Paper hyperparameters (arXiv:2505.02369) on CIFAR-100.
dataset: cifar100
model: resnet18
optimizer:
  type: zsharp
  rho: 0.05
  percentile: 95
  lr: 0.001
  momentum: 0.9  # unused by zsharp; AdamW is the base optimizer
  weight_decay: 5e-5
train:
  batch_size: 256
  epochs: 200
  device: auto
  num_workers: 4
  pin_memory: false
  use_mixed_precision: true
