name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests with coverage
      run: |
        python -m pytest tests/ -v --cov=zsharp --cov-report=xml --cov-report=term-missing --cov-fail-under=95 -m "not mps"

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Lint on a mid-matrix Python; minimum-version compatibility is enforced
    # by ruff's target-version and the test matrix.
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-3.11-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-3.11-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        pip install -e ".[dev]"

    - name: Run ruff check
      run: ruff check zsharp/ tests/ scripts/

    - name: Run ruff format check
      run: ruff format --check zsharp/ tests/ scripts/

    - name: Run mypy type checking
      run: mypy zsharp/

    - name: Run interrogate doc coverage
      run: interrogate zsharp/ --fail-under=100

    - name: Run deptry dependency check
      run: deptry .

    - name: Run vulture dead code detection
      run: vulture zsharp/

    - name: Run import-linter architecture check
      run: python -c "from importlinter.cli import lint_imports_command; lint_imports_command()"

    - name: Run bandit security linting
      run: bandit -r zsharp/ -ll

    - name: Run pip-audit security audit
      run: pip-audit

  test-mps:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-3.11-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-3.11-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run full test suite on Apple Silicon (MPS)
      run: |
        python -m pytest tests/ -v --tb=short --no-cov
